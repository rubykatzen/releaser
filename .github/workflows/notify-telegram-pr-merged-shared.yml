name: Notify Telegram PR merged
"on":
  workflow_call:
    inputs:
      pr-number:
        required: true
        type: number
    secrets:
      TELEGRAM_BOT_TOKEN:
        required: true
      TELEGRAM_CHAT_ID:
        required: true
jobs:
  notify:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
      - id: format
        uses: ./.github/actions/format-pr-merged-message
        with:
          pr-number: ${{ inputs.pr-number }}
      - uses: ./.github/actions/send-telegram-message
        with:
          message: ${{ steps.format.outputs.message }}
          telegram-bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          telegram-chat-id: ${{ secrets.TELEGRAM_CHAT_ID }}
