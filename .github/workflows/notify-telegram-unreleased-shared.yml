name: Notify Telegram unreleased commits
on:
  workflow_call:
    inputs:
      lint-workflow:
        description: Filename of the lint workflow to check
        default: lint.yml
        required: false
        type: string
    secrets:
      TELEGRAM_BOT_TOKEN:
        required: true
      TELEGRAM_CHAT_ID:
        required: true
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check CI status
        id: ci
        run: |
          conclusion=$(gh run list \
            --branch main \
            --workflow "${{ inputs.lint-workflow }}" \
            --limit 1 \
            --json conclusion \
            --jq '.[0].conclusion // "unknown"')
          echo "conclusion=$conclusion" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Check unreleased commits
        id: commits
        run: |
          last_tag=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$last_tag" ]; then
            count=$(git rev-list --count HEAD)
          else
            count=$(git rev-list --count "${last_tag}..HEAD")
          fi
          echo "count=$count" >> "$GITHUB_OUTPUT"
      - id: format
        uses: rubykatzen/releaser/.github/actions/format-unreleased-message@v0.5
        with:
          ci-conclusion: ${{ steps.ci.outputs.conclusion }}
          unreleased-count: ${{ steps.commits.outputs.count }}
      - uses: rubykatzen/releaser/.github/actions/send-telegram-message@v0.5
        with:
          message: ${{ steps.format.outputs.message }}
          telegram-bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          telegram-chat-id: ${{ secrets.TELEGRAM_CHAT_ID }}
