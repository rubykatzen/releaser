name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: New version without v prefix (e.g. 0.1.0)
        required: true
        type: string
      base_sha:
        description: Expected HEAD SHA of main
        required: true
        type: string
concurrency:
  group: release-releaser
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: rubykatzen/baseline/.github/actions/verify-release@v0.2.3
        with:
          base_sha: ${{ inputs.base_sha }}
      - uses: rubykatzen/baseline/.github/actions/generate-notes@v0.2.3
        id: notes
        with:
          version: ${{ inputs.version }}
      - uses: rubykatzen/baseline/.github/actions/commit-changelog@v0.2.3
        with:
          version: ${{ inputs.version }}
          notes: ${{ steps.notes.outputs.notes }}
      - uses: rubykatzen/baseline/.github/actions/bump-pyproject-version@v0.2.3
        with:
          version: ${{ inputs.version }}
      - uses: rubykatzen/baseline/.github/actions/create-release@v0.2.3
        with:
          version: ${{ inputs.version }}
          notes: ${{ steps.notes.outputs.notes }}
  update-tap:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Homebrew tap update
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          gh workflow run update-formulas.yml \
            --repo rubykatzen/homebrew-tap \
            --field version=${{ inputs.version }}
