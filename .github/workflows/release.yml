name: Release
on:
  push:
    tags:
      - "v*"
concurrency:
  group: release-releaser
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: rubykatzen/baseline/.github/actions/create-release@v0.0.12
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref_name }}
      - name: Trigger Homebrew tap update
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          gh workflow run update-formulas.yml \
            --repo rubykatzen/homebrew-tap \
            --field version="${GITHUB_REF_NAME#v}"
