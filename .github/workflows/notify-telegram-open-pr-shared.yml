name: Notify Telegram open PRs
on:
  workflow_call:
    secrets:
      TELEGRAM_BOT_TOKEN:
        required: true
      TELEGRAM_CHAT_ID:
        required: true
jobs:
  notify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Send notification
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          repo="${{ github.repository }}"
          now=$(date +%s)
          prs=$(gh pr list --state open --limit 100 \
            --json number,title,author,isDraft,url,createdAt \
            --jq '[.[] | select(.isDraft == false)]')
          count=$(echo "$prs" | jq 'length')
          if [ "$count" -eq 0 ]; then
            echo "Nothing to notify."
            exit 0
          fi
          lines=$(echo "$prs" | jq -r --argjson now "$now" '
            .[] |
            ((($now - (.createdAt | fromdateiso8601)) / 86400) | floor) as $days |
            "• #" + (.number | tostring) + " " + .title + " — @" + .author.login +
            " (" + ($days | tostring) + "d)\n  " + .url
          ')
          msg=$(printf '🟡 %s: %d open PR(s)\n%s' "$repo" "$count" "$lines")
          curl -fsSL \
            -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg c "$TELEGRAM_CHAT_ID" --arg t "$msg" '{chat_id: $c, text: $t}')"
