name: Lint
on:
  push:
    branches: ["main"]
  pull_request:
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: rubykatzen/baseline/.github/actions/lint-yamllint@v0.4.10
      - uses: rubykatzen/baseline/.github/actions/lint-ruff@v0.4.10
      - uses: rubykatzen/baseline/.github/actions/lint-actionlint@v0.4.10
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install -e . pytest
      - run: pytest
      - run: bash tests/test_changelog.sh
