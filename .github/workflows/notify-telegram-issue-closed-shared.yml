name: Notify Telegram issue closed
on:
  workflow_call:
    inputs:
      issue-number:
        required: true
        type: number
      actor:
        description: GitHub username who closed the issue.
        required: true
        type: string
      notify-label:
        description: Issue label that triggers notification.
        required: false
        type: string
        default: notify
    secrets:
      TELEGRAM_BOT_TOKEN:
        required: true
      TELEGRAM_CHAT_ID:
        required: true
jobs:
  notify:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v7
      - id: issue-labels
        uses: rubykatzen/releaser/.github/actions/issue-get-labels@v0.5
        with:
          number: ${{ inputs.issue-number }}
      - id: format
        if: contains(fromJSON(steps.issue-labels.outputs.labels), inputs.notify-label)
        uses: rubykatzen/releaser/.github/actions/format-issue-closed-message@v0.5
        with:
          issue-number: ${{ inputs.issue-number }}
          actor: ${{ inputs.actor }}
      - uses: rubykatzen/releaser/.github/actions/send-telegram-message@v0.5
        if: contains(fromJSON(steps.issue-labels.outputs.labels), inputs.notify-label) && steps.format.outcome == 'success'
        with:
          message: ${{ steps.format.outputs.message }}
          telegram-bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          telegram-chat-id: ${{ secrets.TELEGRAM_CHAT_ID }}
      - uses: rubykatzen/releaser/.github/actions/issue-remove-label@v0.5
        if: contains(fromJSON(steps.issue-labels.outputs.labels), inputs.notify-label) && steps.format.outcome == 'success'
        with:
          number: ${{ inputs.issue-number }}
          label: ${{ inputs.notify-label }}
