name: Bump Ruby gem version
description: Bump VERSION constant in lib/**/version.rb and commit. Also updates Gemfile.lock if the gem is referenced as a path dependency.
inputs:
  version:
    description: Release version without v prefix.
    required: true
runs:
  using: composite
  steps:
    - name: Bump and commit
      shell: bash
      run: |
        set -euo pipefail
        file=$(grep -rl 'VERSION = "' lib/ 2>/dev/null | head -1 || true)
        if [ -z "$file" ]; then
          exit 0
        fi
        sed -i "s/VERSION = \".*\"/VERSION = \"${{ inputs.version }}\"/" "$file"
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add "$file"
        git diff --cached --quiet || git commit -m "chore: bump version to ${{ inputs.version }}"
        if [ -f Gemfile.lock ] && grep -q 'remote: \.' Gemfile.lock && command -v bundle > /dev/null 2>&1; then
          gem_name=$(basename "$(ls *.gemspec 2>/dev/null | head -1)" .gemspec)
          bundle update "$gem_name"
          git add Gemfile.lock
          git diff --cached --quiet || git commit -m "chore: update Gemfile.lock for ${{ inputs.version }}"
        fi
