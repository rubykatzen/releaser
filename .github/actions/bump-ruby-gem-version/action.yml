name: Bump Ruby gem version
description: Bump VERSION constant in lib/**/version.rb and commit.
inputs:
  version:
    description: Release version without v prefix.
    required: true
runs:
  using: composite
  steps:
    - name: Bump and commit
      shell: bash
      run: |
        set -euo pipefail
        file=$(grep -rl 'VERSION = "' lib/ 2>/dev/null | head -1 || true)
        if [ -z "$file" ]; then
          exit 0
        fi
        sed -i "s/VERSION = \".*\"/VERSION = \"${{ inputs.version }}\"/" "$file"
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add "$file"
        git commit -m "chore: bump version to ${{ inputs.version }}"
