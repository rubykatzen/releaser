name: Publish Python package to PyPI
description: >
  Build a Python distribution and publish it to PyPI.
  Uses OIDC trusted publishing by default; pass pypi-token to use API token auth instead.
  When using OIDC the calling workflow must set permissions.id-token: write.
inputs:
  pypi-token:
    description: >
      PyPI API token. If omitted, OIDC trusted publishing is used
      (the calling workflow must grant id-token: write permission).
    required: false
    default: ""
  python-version:
    description: Python version to use for building.
    required: false
    default: "3.12"
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install build dependencies
      shell: bash
      run: pip install build
    - name: Build distribution
      shell: bash
      run: python -m build
    - uses: pypa/gh-action-pypi-publish@release/v1
      with:
        password: ${{ inputs.pypi-token }}
