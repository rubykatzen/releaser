name: Verify release preconditions
description: Verify base SHA matches HEAD and CI is green.
inputs:
  base_sha:
    description: Expected HEAD SHA of main.
    required: true
  ci_workflow:
    description: Workflow file to check for green status.
    required: false
    default: lint.yml
  token:
    description: GitHub token.
    required: false
    default: ${{ github.token }}
runs:
  using: composite
  steps:
    - name: Verify base SHA
      shell: bash
      run: |
        set -euo pipefail
        current=$(git rev-parse HEAD)
        if [ "$current" != "${{ inputs.base_sha }}" ]; then
          echo "main has moved: expected ${{ inputs.base_sha }}, got $current"
          exit 1
        fi
    - name: Verify CI
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        CI_WORKFLOW: ${{ inputs.ci_workflow }}
      run: |
        set -euo pipefail
        current=$(git rev-parse HEAD)
        check_name="${CI_WORKFLOW%.yml}"
        conclusion=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${current}/check-runs" \
          --paginate \
          --jq "[.check_runs[] | select(.name == \"${check_name}\")] | last | .conclusion // \"missing\"")
        if [ "$conclusion" != "success" ]; then
          echo "CI is not green on ${current}: ${check_name}=${conclusion}"
          exit 1
        fi
