name: Generate release notes
description: Generate AI release notes from git commits and CHANGELOG [Unreleased] draft notes.
inputs:
  version:
    description: Release version without v prefix.
    required: true
  token:
    description: GitHub token for AI API access.
    required: false
    default: ${{ github.token }}
outputs:
  notes:
    description: Generated release notes.
    value: ${{ steps.generate.outputs.notes }}
runs:
  using: composite
  steps:
    - name: Generate
      id: generate
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
      run: |
        set -euo pipefail
        # shellcheck source=../lib/changelog.sh
        source "${{ github.action_path }}/../lib/changelog.sh"
        tag="v${{ inputs.version }}"
        prev_tag=$(git tag --sort=-version:refname | grep -E '^v[0-9]' | grep -v "^${tag}$" | head -1 || true)
        if [ -n "$prev_tag" ]; then
          commits=$(git log "${prev_tag}..HEAD" --format="- %s" --no-merges | head -50)
        else
          commits=$(git log HEAD --format="- %s" --no-merges | head -50)
        fi
        unreleased=""
        if [ -f CHANGELOG.md ]; then
          unreleased=$(extract_unreleased_content CHANGELOG.md)
        fi
        notes=""
        if [ -n "$commits" ] || [ -n "$unreleased" ]; then
          prompt="You are writing a changelog entry for a software release."
          if [ -n "$unreleased" ]; then
            prompt="${prompt} Below are draft notes from the CHANGELOG [Unreleased] section."
          fi
          if [ -n "$commits" ]; then
            prompt="${prompt} Below are the git commits in this release."
          fi
          prompt="${prompt} Write a concise 2-4 sentence summary in English describing what changed. Write plain prose — no bullet points, no headers."
          content="${prompt}"
          if [ -n "$unreleased" ]; then
            content="${content}"$'\n\n'"Draft [Unreleased] notes:"$'\n'"${unreleased}"
          fi
          if [ -n "$commits" ]; then
            content="${content}"$'\n\n'"Commits:"$'\n'"${commits}"
          fi
          payload=$(jq -n --arg content "$content" '{
            model: "gpt-4o-mini",
            messages: [{
              role: "user",
              content: $content
            }],
            max_tokens: 300
          }')
          response=$(curl -sf \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: application/json" \
            "https://models.inference.ai.azure.com/chat/completions" \
            -d "$payload" || true)
          notes=$(echo "$response" | jq -r '.choices[0].message.content // empty' 2>/dev/null || true)
        fi
        if [ -z "$notes" ]; then
          if [ -n "$unreleased" ]; then
            notes="$unreleased"
          else
            notes="${commits:-No changes}"
          fi
        fi
        {
          echo "notes<<RELEASE_NOTES_EOF"
          printf '%s' "$notes"
          echo ""
          echo "RELEASE_NOTES_EOF"
        } >> "$GITHUB_OUTPUT"
