name: Update Homebrew formulas
description: Update every formula in the checked-out tap to the latest upstream version.
inputs:
  token:
    description: GitHub token.
    required: false
    default: ${{ github.token }}
  update_branch:
    description: Branch to push formula updates to.
    required: false
    default: chore/update-formulas
  auto_merge:
    description: Enable auto-merge on the opened or updated PR.
    required: false
    default: "false"
  post_push_workflows:
    description: >-
      Workflow files to dispatch after push (comma- or newline-separated),
      for example lint.yml.
    required: false
    default: ""
outputs:
  changed:
    description: Whether any formula was updated.
    value: ${{ steps.bump.outputs.changed }}
  formulas_updated:
    description: Comma-separated list of formulas that were updated.
    value: ${{ steps.bump.outputs.formulas_updated }}
runs:
  using: composite
  steps:
    - name: Bump all formulas to latest upstream versions
      id: bump
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        HOMEBREW_GITHUB_API_TOKEN: ${{ inputs.token }}
        HOMEBREW_NO_AUTO_UPDATE: "1"
        GITHUB_REPOSITORY: ${{ github.repository }}
        UPDATE_BRANCH: ${{ inputs.update_branch }}
        AUTO_MERGE: ${{ inputs.auto_merge }}
        POST_PUSH_WORKFLOWS: ${{ inputs.post_push_workflows }}
      run: |
        set -euo pipefail
        owner="${GITHUB_REPOSITORY%%/*}"
        repo_name="${GITHUB_REPOSITORY#*/}"
        if [[ "$repo_name" == homebrew-* ]]; then
          tap="${owner}/${repo_name#homebrew-}"
        else
          tap="$GITHUB_REPOSITORY"
        fi
        if [ ! -d Formula ]; then
          echo "Formula directory not found in ${GITHUB_REPOSITORY}" >&2
          exit 1
        fi
        shopt -s nullglob
        formula_paths=(Formula/*.rb)
        if [ "${#formula_paths[@]}" -eq 0 ]; then
          echo "No formulas found in Formula/."
          echo "changed=false" >> "$GITHUB_OUTPUT"
          echo "formulas_updated=" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        brew tap "$tap" "$PWD"
        tap_path="$(brew --repository "$tap")"
        git config user.name "github-actions[bot]"
        bot_email="41898282+github-actions[bot]@users.noreply.github.com"
        git config user.email "$bot_email"
        git checkout -B "$UPDATE_BRANCH"
        changed=false
        updated_formulas=()
        for formula_path in "${formula_paths[@]}"; do
          formula="$(basename "$formula_path" .rb)"
          full_formula="${tap}/${formula}"
          latest="$(
            brew livecheck "$full_formula" --json |
              jq -r '.[0].version.latest // ""'
          )"
          current="$(
            brew info "$full_formula" --json=v2 |
              jq -r '.formulae[0].versions.stable // ""'
          )"
          if [ -z "$latest" ] || [ "$latest" = "null" ]; then
            echo "Could not resolve latest version for $full_formula, skipping." >&2
            continue
          fi
          if [ "$latest" = "$current" ]; then
            echo "$full_formula already current ($current)."
            continue
          fi
          brew bump-formula-pr "$full_formula" \
            --version "$latest" \
            --write-only \
            --no-browse \
            --no-fork
          # brew writes to its own tap clone, not to $PWD — copy the result back
          cp "$tap_path/$formula_path" "$formula_path"
          git add "$formula_path"
          if git diff --cached --quiet; then
            echo "Homebrew reported latest=$latest for $full_formula, but no changes were produced."
            continue
          fi
          brew audit --strict "$full_formula"
          git commit -m "${formula}: update to v${latest}"
          changed=true
          updated_formulas+=("$formula")
        done
        if [ "$changed" = true ]; then
          git push origin "$UPDATE_BRANCH" --force
          if [ -n "$POST_PUSH_WORKFLOWS" ]; then
            while IFS= read -r workflow; do
              workflow="${workflow// /}"
              [ -z "$workflow" ] && continue
              echo "Dispatching workflow ${workflow} on ref ${UPDATE_BRANCH}"
              gh workflow run "$workflow" \
                --repo "$GITHUB_REPOSITORY" \
                --ref "$UPDATE_BRANCH"
            done < <(printf '%s\n' "${POST_PUSH_WORKFLOWS//,/}")
          fi
          pr_url="$(
            gh pr list \
              --repo "$GITHUB_REPOSITORY" \
              --head "$UPDATE_BRANCH" \
              --base main \
              --state open \
              --json url \
              --jq '.[0].url'
          )"
          if [ -z "$pr_url" ]; then
            printf -v pr_body '%s' "Automated Homebrew formula updates: ${updated_formulas[*]+"${updated_formulas[*]}"}."
            pr_url="$(
              gh pr create \
                --repo "$GITHUB_REPOSITORY" \
                --title "chore: update Homebrew formulas" \
                --body "$pr_body" \
                --base main \
                --head "$UPDATE_BRANCH"
            )"
            echo "Created PR: $pr_url"
          else
            echo "Updated existing PR: $pr_url"
          fi
          if [ "$AUTO_MERGE" = "true" ]; then
            gh pr merge "$pr_url" --auto --squash \
              || echo "Note: auto-merge unavailable; merge $pr_url manually."
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          printf -v joined '%s,' "${updated_formulas[@]}"
          echo "formulas_updated=${joined%,}" >> "$GITHUB_OUTPUT"
        else
          echo "changed=false" >> "$GITHUB_OUTPUT"
          echo "formulas_updated=" >> "$GITHUB_OUTPUT"
        fi
