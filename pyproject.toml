[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "releaser"
dynamic = ["version"]
description = "Opinionated zero-config release gate for GitHub repositories."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "rubykatzen" },
]
dependencies = []

[project.scripts]
releaser = "releaser.cli:main"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/releaser"]

[tool.pytest.ini_options]
pythonpath = ["src"]
